# Exposes the router's Envoy listener on the kind host port mapping
# (local/kind-config.yaml maps container 30080 -> host 8080), so T0 is
# reachable at http://localhost:8080 with no port-forward.
#
# Selector verified by rendering the router chart: the EPP pods carry
# `llm-d-router-gateway: <release>-epp`, and the Envoy sidecar listens on 8081.
apiVersion: v1
kind: Service
metadata:
  name: ${RELEASE}-local
  namespace: ${NS}
spec:
  type: NodePort
  selector:
    llm-d-router-gateway: ${RELEASE}-epp
  ports:
    - name: http
      port: 80
      targetPort: 8081
      nodePort: 30080
