# Simulator model server for T0/T1.
#
# llm-d-inference-sim speaks the vLLM OpenAI API and emits real vLLM Prometheus
# metrics, so the router, EPP and KEDA treat it exactly like a GPU-backed vLLM.
#
# Two contracts with the llm-d router chart, verified by rendering the chart:
#   - label  llm-d.ai/inference-pool: <release>   (the pool selector)
#   - port   8000                                 (hardcoded in the chart's Service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RELEASE}-vllm-decode
  namespace: ${NS}
  labels:
    llm-d.ai/inference-pool: ${RELEASE}
    llm-d.ai/role: decode
    llm-d-eks-lab/tier: sim
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/inference-pool: ${RELEASE}
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/inference-pool: ${RELEASE}
        llm-d.ai/role: decode
        llm-d-eks-lab/tier: sim
    spec:
      nodeSelector:
        llm-d-eks-lab/role: model-server
      containers:
        - name: modelserver
          image: ${SIM_IMAGE}
          # Only --model and --port are used. The simulator's latency behaviour
          # (time-to-first-token, inter-token latency, concurrency slowdown) is
          # configured through a `latencies` block in a --config file, not via
          # individual flags — see the project's docs/latency-simulation.md if
          # you want to make the fake timings resemble a real L40S.
          args:
            - "--model"
            - "${MODEL}"
            - "--port"
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
