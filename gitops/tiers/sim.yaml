# sim — llm-d-inference-sim, no GPU. Speaks the vLLM OpenAI API and emits real
# vLLM metrics, so the router, EPP, KEDA and Karpenter behave as they would
# with a real model. ~$0.03/hr of CPU on EKS, free on kind.
tier: sim
model: Qwen/Qwen3.5-4B
image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
gpu:
  enabled: false
resources:
  cpuRequest: 500m
  memoryRequest: 1Gi
  memoryLimit: 2Gi
capacity:
  instanceTypes: [c7i.large, m7i.large, c6i.large]
  capacityTypes: [spot]
  vcpuLimit: 16
  diskSizeGb: 40
autoscaling:
  minReplicas: 1
  maxReplicas: 4
