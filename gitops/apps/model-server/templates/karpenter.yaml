{{- if .Values.karpenter.enabled }}
{{- if not .Values.karpenter.nodeRole }}
{{- fail "karpenter.nodeRole is required when karpenter.enabled — the root app injects it from Terraform" }}
{{- end }}
# Capacity for this tier. Deleting the NodePool (tier: none, or the app being
# pruned) makes Karpenter terminate every node it launched for it — this is
# what takes idle GPU cost to zero.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ include "ms.nodepool" . }}
spec:
  # Resolves to the EKS-optimized AL2023 AMI; for GPU instance types that is the
  # NVIDIA variant (driver + container toolkit, but NOT the device plugin —
  # the root app installs that separately).
  amiSelectorTerms:
    - alias: al2023@latest
  role: {{ .Values.karpenter.nodeRole }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.karpenter.discoveryTag }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.karpenter.discoveryTag }}
  # No NAT gateway in this VPC: nodes need a public IP to pull images/weights.
  associatePublicIPAddress: true
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: {{ .Values.capacity.diskSizeGb }}Gi
        volumeType: gp3
        deleteOnTermination: true
        encrypted: true
        {{- with .Values.capacity.diskThroughputMbps }}
        throughput: {{ . }}
        {{- end }}
        {{- with .Values.capacity.diskIops }}
        iops: {{ . }}
        {{- end }}
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2
  # karpenter.sh/* tags are reserved — setting one gets the whole object
  # rejected by the API server.
  tags:
    Name: {{ include "ms.nodepool" . }}
    Project: {{ .Values.project }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ include "ms.nodepool" . }}
spec:
  template:
    metadata:
      labels:
        llm-d-eks-lab/role: model-server
        llm-d-eks-lab/tier: {{ .Values.tier }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ include "ms.nodepool" . }}
      {{- if .Values.gpu.enabled }}
      # Only pods that explicitly tolerate this land on GPU hardware.
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      {{- end }}
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ toJson .Values.capacity.instanceTypes }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.capacity.capacityTypes }}
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      terminationGracePeriod: 2m
      expireAfter: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: {{ .Values.capacity.vcpuLimit }}
  weight: 100
{{- end }}
