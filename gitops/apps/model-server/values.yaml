# Defaults for the model-server chart. A tier file in gitops/tiers/ overrides
# the workload; the root app injects the environment block (cluster facts and
# secrets-adjacent values that must not live in a public repo).

# --- injected by the root app -------------------------------------------------
environment: eks          # eks | kind
project: llm-d-eks-lab
karpenter:
  # Off on kind: there is no EC2 to provision, the kind workers are labelled
  # as model-server capacity instead.
  enabled: true
  nodeRole: ""            # Karpenter node IAM role name (Terraform output)
  discoveryTag: llm-d-eks-lab
allowedCidrs: []          # who may reach the public endpoints (EKS only)
webui:
  enabled: true

# --- set by the tier file -----------------------------------------------------
tier: sim
release: llm-d            # router Helm release name; EPP service is <release>-epp
namespace: llm-d

model: Qwen/Qwen3.5-4B
image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
gpu:
  enabled: false
  count: 1

# vLLM args (gpu.enabled). The simulator only takes --model/--port.
args: []

resources:
  cpuRequest: 500m
  memoryRequest: 1Gi
  memoryLimit: 2Gi

shmSize: 4Gi
# 10s per attempt. Must cover image pull + weights download + load.
startupProbeFailureThreshold: 60

capacity:
  instanceTypes: [c7i.large, m7i.large, c6i.large]
  capacityTypes: [spot]
  # NodePool vCPU ceiling — keep at or below the G/VT quota for the capacity type.
  vcpuLimit: 16
  diskSizeGb: 40
  diskThroughputMbps: null
  diskIops: null

autoscaling:
  minReplicas: 1
  maxReplicas: 4
  queueDepthTarget: 1
  runningRequestsTarget: 16
  stabilizationSeconds: 300

prometheusAddress: http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090
