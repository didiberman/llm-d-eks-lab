# llm-d router (standalone mode) values for this lab.
#
# Consumed by the llm-d-router Argo CD application (gitops/root).
# The pool name (llm-d) must equal the router Helm release name.
#
# Equivalent to layering three upstream files, flattened into one because
# an Argo CD Helm source takes one values file here:
#
#   guides/recipes/router/base.values.yaml
#   guides/optimized-baseline/router/optimized-baseline.values.yaml
#   guides/workload-autoscaling/keda-epp/optimized-baseline/router.values.yaml
#
# Two deliberate departures from upstream, both forced by this being a 2-node
# lab rather than a benchmark rig:
#
# 1. RESOURCES. Upstream requests cpu: "4" / memory: 8Gi for the EPP *and*
#    cpu: "4" / 8Gi for the Envoy sidecar — 8 vCPU and 16Gi for the router
#    alone, which will not schedule on this cluster's system nodes. Scaled down
#    ~8x. At lab QPS this is ample; restore upstream values before drawing any
#    conclusion about router throughput.
#
# 2. PLUGINS. Uses the keda-epp plugin set (queue-scorer + kv-cache +
#    prefix-cache + no-hit-lru) with `featureGates: [flowControl]`, NOT the
#    optimized-baseline default set. flowControl is what emits
#    llm_d_epp_flow_control_queue_size, the metric KEDA scales on. Without the
#    feature gate the ScaledObject's query returns nothing and nothing ever
#    scales.
#
#    The optimized-baseline default set uses prefix-cache-affinity-filter,
#    whose peakPrefillThroughput default (15928) is calibrated for Qwen3-32B on
#    an H100 at TP=2 — wrong for an L40S — so it is avoided here rather than
#    left mis-tuned. See guides/recipes/router/calibration to measure a real
#    value if you switch to it.

router:
  inferencePool:
    failureMode: FailOpen

  modelServers:
    protocol: http
    # Selects the vLLM pods this router fronts. Must match the labels on the
    # model-server Deployment (gitops/apps/model-server).
    matchLabels:
      llm-d.ai/inference-pool: llm-d

  # In the default sidecar proxy mode these ports are added to the router's own
  # Service. Port 80 -> the Envoy sidecar's listener on 8081.
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  monitoring:
    prometheus:
      # Creates the ServiceMonitor that makes Prometheus scrape EPP metrics.
      # KEDA reads those metrics, so without this the whole autoscaling path is
      # dark. Requires the Prometheus Operator CRDs (kube-prometheus-stack,
      # installed in 10-cluster).
      enabled: true

  proxy:
    enabled: true
    proxyType: envoy
    mode: sidecar
    # Upstream default is 2. One is enough here and keeps the system nodes free.
    replicas: 1
    terminationGracePeriodSeconds: 70
    args:
      - "--service-node"
      - "envoy-sidecar"
      # Upstream chart default is `trace`, which burns real CPU under load.
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "2"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        memory: 2Gi

  epp:
    replicas: 1
    flags:
      v: 2
    pluginsConfigFile: "lab-keda-epp-plugins.yaml"
    pluginsCustomConfig:
      lab-keda-epp-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        featureGates:
        - flowControl
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: no-hit-lru-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        memory: 2Gi
