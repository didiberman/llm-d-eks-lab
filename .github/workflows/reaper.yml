# Nightly reaper — the cost guardrail that stops a forgotten GPU billing for a
# week (a Kimi node is ~$200/day).
#
# With Argo CD reconciling the cluster from git, deleting resources directly
# would just be undone on the next sync. So the reaper changes the desired
# state instead:
#
#   1. commit `tier: none` to deploy/config.yaml        (git is the source of truth)
#   2. ask Argo CD to refresh                           (it prunes the inference
#      layer; deleting the NodePool makes Karpenter terminate its nodes)
#   3. wait for the NodePools and Karpenter instances to be gone
#   4. backstop: if any survive, delete NodePools and terminate the instances
#      directly, then fail loudly
#
# The cluster itself (~$0.26/hr) is left up; tear it down with the destroy
# workflow. To bring the model back, set the tier again and push.
name: reaper

on:
  schedule:
    # 03:00 UTC daily. GitHub cron is best-effort and can run up to ~1h late.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: write # commit tier: none

# Shared with deploy and destroy.
concurrency:
  group: aws-llm-d-eks-lab
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  CLUSTER: llm-d-eks-lab

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set tier none in git
        id: git
        run: |
          set -euo pipefail
          tier=$(awk '/^tier:/{print $2}' deploy/config.yaml)
          echo "tier was: $tier"
          if [ "$tier" = none ]; then
            echo "Already none — nothing to commit."
            exit 0
          fi
          sed -i 's/^tier: .*/tier: none/' deploy/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "reaper: set tier none (was $tier)"
          # GITHUB_TOKEN pushes do not trigger other workflows — Argo CD picks
          # the change up from git directly.
          git push
          echo "reaped=$tier" >> "$GITHUB_OUTPUT"

      - name: Check the reaper role is configured
        id: guard
        run: |
          if [ -z "${{ secrets.AWS_REAPER_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Reaper not configured::Set the AWS_REAPER_ROLE_ARN secret. Git now says tier none, but GPU instances are not being verified."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.guard.outputs.configured == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_REAPER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mask account ID
        if: steps.guard.outputs.configured == 'true'
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: Wait for Argo CD to prune the inference layer
        if: steps.guard.outputs.configured == 'true'
        id: prune
        run: |
          set -uo pipefail
          if ! aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "No cluster — nothing running to reap."
            exit 0
          fi
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER" >/dev/null
          kubectl -n argocd annotate application root argocd.argoproj.io/refresh=hard --overwrite >/dev/null || true
          for i in $(seq 1 60); do
            pools=$(kubectl get nodepools.karpenter.sh --no-headers 2>/dev/null | grep -c . || true)
            nodes=$(aws ec2 describe-instances \
              --filters "Name=tag-key,Values=karpenter.sh/nodepool" "Name=tag:eks:eks-cluster-name,Values=${CLUSTER}" \
                        "Name=instance-state-name,Values=pending,running,stopping" \
              --query 'length(Reservations[].Instances[])' --output text)
            echo "nodepools=$pools karpenter instances=$nodes"
            if [ "$pools" = 0 ] && [ "$nodes" = 0 ]; then echo "Inference layer pruned."; exit 0; fi
            sleep 15
          done
          echo "::warning::Argo CD did not prune everything within 15 minutes — using the backstop."
          echo "stuck=true" >> "$GITHUB_OUTPUT"

      # Argo CD might be broken — the very situation a guardrail exists for.
      # Remove capacity directly; with git already at tier none, Argo CD will
      # not put it back.
      - name: Backstop — delete NodePools and terminate Karpenter instances
        if: steps.prune.outputs.stuck == 'true'
        run: |
          kubectl delete nodepools.karpenter.sh --all --wait=false || true
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag-key,Values=karpenter.sh/nodepool" "Name=tag:eks:eks-cluster-name,Values=${CLUSTER}" \
                      "Name=instance-state-name,Values=pending,running,stopping" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$ids" ]; then aws ec2 terminate-instances --instance-ids $ids >/dev/null; echo "Terminated: $ids"; fi

      - name: Report
        if: always()
        run: |
          {
            echo "### Reaper report"
            echo "- tier before: ${{ steps.git.outputs.reaped || 'none (already)' }}"
            echo "- Argo CD pruned in time: ${{ steps.prune.outputs.stuck == 'true' && 'no — backstop used' || 'yes' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail loudly if GPU instances survived
        if: always() && steps.guard.outputs.configured == 'true'
        run: |
          gpus=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=instance-state-name,Values=pending,running \
            --query "Reservations[].Instances[?starts_with(InstanceType,'g') || starts_with(InstanceType,'p')].InstanceId" \
            --output text)
          if [ -n "$gpus" ]; then
            echo "::error title=GPU instances still running::$gpus"
            exit 1
          fi
          echo "No GPU instances running."
