# Destroy — tear down ALL billable infrastructure, on demand.
#
# Actions → destroy → Run workflow, type "destroy" to confirm.
#
# Order matters:
#   1. Argo CD apps  delete the root Application. Its finalizer cascades through
#                    every child app: NodePools go (Karpenter terminates the
#                    GPU nodes) and the public Services go (EKS deletes their
#                    NLBs, asynchronously).
#   2. wait          for those NLBs and Karpenter nodes to actually disappear.
#                    A leftover NLB holds ENIs and a security group in the VPC
#                    and makes step 3 fail with DependencyViolation.
#   3. 10-cluster    Argo CD, EKS, Karpenter, KEDA, Prometheus, VPC.
#   4. sweep         leaked CNI interfaces and orphaned Karpenter instances,
#                    then fail loudly if anything still bills.
#
# Left in place on purpose (~$0): 00-bootstrap — the S3 state bucket
# (prevent_destroy) and the GitHub OIDC roles this workflow itself uses.
#
# deploy/config.yaml is NOT changed. Set `cluster: false` too, or the next push
# under terraform/10-cluster/ recreates the cluster.
name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down the cluster and everything on it'
        required: true
        type: string

permissions:
  id-token: write # OIDC
  contents: read

# Same group as deploy and reaper: never race an apply for the state lock.
concurrency:
  group: aws-llm-d-eks-lab
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  CLUSTER: llm-d-eks-lab
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VERSION: "1.13.4"

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Mask account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Same inputs the deploy workflow passes, so the destroy plan evaluates
      # the configuration exactly as it was applied.
      - name: Terraform inputs
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          REAPER_ROLE_ARN: ${{ vars.REAPER_ROLE_ARN }}
          ADMIN_PRINCIPAL_ARN: ${{ vars.ADMIN_PRINCIPAL_ARN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          ALLOWED_CIDRS: ${{ secrets.ALLOWED_CIDRS }}
        run: |
          set -euo pipefail
          [ -n "${{ vars.STATE_BUCKET }}" ] || { echo "::error::Repo variable STATE_BUCKET is not set"; exit 1; }
          {
            echo "TF_VAR_region=$AWS_REGION"
            echo "TF_VAR_project=$CLUSTER"
            echo "TF_VAR_deploy_role_arn=$DEPLOY_ROLE_ARN"
            [ -n "$REAPER_ROLE_ARN" ] && echo "TF_VAR_reaper_role_arn=$REAPER_ROLE_ARN"
            [ -n "$ADMIN_PRINCIPAL_ARN" ] && echo "TF_VAR_admin_principal_arn=$ADMIN_PRINCIPAL_ARN"
            [ -n "$BUDGET_ALERT_EMAIL" ] && echo "TF_VAR_budget_alert_email=$BUDGET_ALERT_EMAIL"
            [ -n "$ALLOWED_CIDRS" ] && echo "TF_VAR_allowed_cidrs=$ALLOWED_CIDRS"
            true
          } >> "$GITHUB_ENV"

      - name: Cluster present?
        id: cluster
        run: |
          if aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No EKS cluster found — skipping the Argo CD teardown; 10-cluster is still destroyed if its state holds anything (e.g. a VPC left by a failed run)."
          fi

      # Deleting the root app (foreground) cascades through every child app
      # and what they deployed, thanks to the resources finalizers. Terraform
      # would otherwise uninstall Argo CD first and orphan the NLBs and nodes.
      - name: Delete the Argo CD apps (cascades to NodePools, NLBs, workloads)
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -uo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER" >/dev/null
          if kubectl -n argocd get application root >/dev/null 2>&1; then
            kubectl -n argocd delete application root --cascade=foreground --wait=true --timeout=15m \
              || echo "::warning::Root app deletion did not finish in 15 minutes — falling back to direct deletes."
          fi
          # Backstop, in case Argo CD itself is broken.
          kubectl -n argocd delete applications.argoproj.io --all --wait=false 2>/dev/null || true
          kubectl delete nodepools.karpenter.sh --all --wait=false 2>/dev/null || true
          kubectl -n llm-d delete service --field-selector spec.type=LoadBalancer --wait=false 2>/dev/null || true

      - name: Wait for Kubernetes-created load balancers and GPU nodes to go
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            lbs=$(aws resourcegroupstaggingapi get-resources \
              --resource-type-filters elasticloadbalancing:loadbalancer \
              --tag-filters "Key=kubernetes.io/cluster/${CLUSTER}" \
              --query 'length(ResourceTagMappingList)' --output text)
            nodes=$(aws ec2 describe-instances \
              --filters "Name=tag-key,Values=karpenter.sh/nodepool" \
                        "Name=tag:eks:eks-cluster-name,Values=${CLUSTER}" \
                        "Name=instance-state-name,Values=pending,running,stopping,shutting-down" \
              --query 'length(Reservations[].Instances[])' --output text)
            echo "load balancers=$lbs karpenter nodes=$nodes"
            [ "$lbs" = "0" ] && [ "$nodes" = "0" ] && exit 0
            sleep 15
          done
          echo "::warning::Load balancers or Karpenter nodes still present after 10 minutes — continuing; the sweep step will report them."

      # The VPC CNI attaches extra "aws-K8S-<instance>" ENIs to every node and
      # normally deletes them when the node goes. If the cluster disappears
      # first they are left detached ("available") in a subnet, holding the
      # subnet and the node security group, and the VPC destroy fails with
      # DependencyViolation after a 20-minute retry loop. Delete them first.
      - name: Sweep leaked VPC CNI network interfaces
        run: |
          set -euo pipefail
          vpc=$(aws ec2 describe-vpcs --filters "Name=tag:Project,Values=${CLUSTER}" --query 'Vpcs[0].VpcId' --output text)
          [ "$vpc" = "None" ] && { echo "No project VPC."; exit 0; }
          for id in $(aws ec2 describe-network-interfaces               --filters "Name=vpc-id,Values=${vpc}" "Name=status,Values=available" "Name=description,Values=aws-K8S-*"               --query 'NetworkInterfaces[].NetworkInterfaceId' --output text); do
            echo "Deleting leaked CNI interface $id"
            aws ec2 delete-network-interface --network-interface-id "$id"
          done

      # Not gated on the cluster existing: a previous run can die after the
      # cluster is gone but before the VPC is, and that VPC must still go.
      - name: Destroy 10-cluster
        working-directory: terraform/10-cluster
        run: |
          set -uo pipefail
          terraform init -no-color \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"
          if [ -z "$(terraform state list 2>/dev/null)" ]; then
            echo "10-cluster state is empty — nothing to destroy."
            exit 0
          fi
          terraform destroy -no-color -auto-approve && exit 0

          # Most likely an ENI that only became "available" after its node
          # finished terminating. Sweep again and retry once.
          echo "::warning::10-cluster destroy failed — sweeping leaked ENIs and retrying once."
          vpc=$(aws ec2 describe-vpcs --filters "Name=tag:Project,Values=${CLUSTER}" --query 'Vpcs[0].VpcId' --output text)
          if [ "$vpc" != "None" ]; then
            sleep 60
            for id in $(aws ec2 describe-network-interfaces \
                --filters "Name=vpc-id,Values=${vpc}" "Name=status,Values=available" "Name=description,Values=aws-K8S-*" \
                --query 'NetworkInterfaces[].NetworkInterfaceId' --output text); do
              echo "Deleting leaked CNI interface $id"
              aws ec2 delete-network-interface --network-interface-id "$id"
            done
          fi
          terraform destroy -no-color -auto-approve

      # Karpenter terminates its nodes when a NodePool is deleted, but if the
      # controller died first they are orphaned and Terraform never knew them.
      - name: Sweep orphaned Karpenter instances
        if: always()
        run: |
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag-key,Values=karpenter.sh/nodepool" \
                      "Name=tag:eks:eks-cluster-name,Values=${CLUSTER}" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$ids" ]; then
            echo "Terminating orphaned Karpenter instances: $ids"
            aws ec2 terminate-instances --instance-ids $ids >/dev/null
          else
            echo "None."
          fi

      - name: Verify nothing is still billing
        if: always()
        run: |
          set -u
          if aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then clusters=1; else clusters=0; fi
          instances=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=${CLUSTER}" "Name=instance-state-name,Values=pending,running" \
            --query 'length(Reservations[].Instances[])' --output text)
          karp=$(aws ec2 describe-instances \
            --filters "Name=tag-key,Values=karpenter.sh/nodepool" "Name=tag:eks:eks-cluster-name,Values=${CLUSTER}" \
                      "Name=instance-state-name,Values=pending,running" \
            --query 'length(Reservations[].Instances[])' --output text)
          lbs=$(aws resourcegroupstaggingapi get-resources --resource-type-filters elasticloadbalancing:loadbalancer \
            --tag-filters "Key=kubernetes.io/cluster/${CLUSTER}" --query 'length(ResourceTagMappingList)' --output text)
          nats=$(aws ec2 describe-nat-gateways --filter Name=state,Values=available "Name=tag:Project,Values=${CLUSTER}" \
            --query 'length(NatGateways)' --output text)
          vpcs=$(aws ec2 describe-vpcs --filters "Name=tag:Project,Values=${CLUSTER}" --query 'length(Vpcs)' --output text)
          {
            echo "### Destroy report"
            echo "| Resource | Remaining |"
            echo "|---|---|"
            echo "| EKS cluster | $clusters |"
            echo "| Project-tagged instances | $instances |"
            echo "| Karpenter instances | $karp |"
            echo "| Cluster load balancers | $lbs |"
            echo "| NAT gateways | $nats |"
            echo "| Project VPCs | $vpcs |"
            echo ""
            echo "Left on purpose: S3 state bucket and GitHub OIDC roles (00-bootstrap, ~\$0)."
            echo "deploy/config.yaml is unchanged — set \`cluster: false\` or the next push under terraform/10-cluster/ recreates it."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          total=$((clusters + instances + karp + lbs + nats + vpcs))
          if [ "$total" -ne 0 ]; then
            echo "::error title=Infrastructure still present::$total billable resource(s) remain — see the report."
            exit 1
          fi
          echo "All clear: nothing left billing."

  refused:
    if: inputs.confirm != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Confirmation must be exactly \"destroy\" — nothing was touched."
          exit 1
