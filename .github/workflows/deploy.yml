# Deploy — infrastructure by Terraform, everything on the cluster by Argo CD.
#
#   terraform/10-cluster/**   -> cluster job: terraform plan, apply if non-empty
#                                (EKS, Karpenter, KEDA, Prometheus, Argo CD and
#                                the root Application)
#   gitops/**, deploy/**      -> verify job: nothing to apply — Argo CD pulls the
#                                change from git. CI asks it to refresh now,
#                                waits for every app to be Synced + Healthy, and
#                                smoke-tests the model.
#
# deploy/config.yaml is the switch:
#   cluster: false  CI never creates the cluster (no accidental $0.26/hr)
#   tier: <name>    what Argo CD runs; none prunes the inference layer
#
# Docs and anything else never trigger this workflow. 00-bootstrap is not
# applied here: it creates the role this workflow assumes.
#
# SETUP (one time):
#   secret   AWS_DEPLOY_ROLE_ARN  = 00-bootstrap output github_deploy_role_arn
#   secret   ALLOWED_CIDRS        = JSON list, e.g. ["1.2.3.4/32"] (a secret so the
#                                   IP is masked in public logs)
#   secret   HF_TOKEN             = optional, HuggingFace token
#   secret   BUDGET_ALERT_EMAIL   = optional, enables the AWS Budget alert
#   variable STATE_BUCKET         = 00-bootstrap output state_bucket
#   variable REAPER_ROLE_ARN      = 00-bootstrap output github_reaper_role_arn
#   variable ADMIN_PRINCIPAL_ARN  = IAM user/role that gets kubectl access
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/10-cluster/**"
      - "gitops/**"
      - "deploy/**"
      - "scripts/wait-for-apps.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

# Shared with reaper and destroy: never race an apply or a teardown.
concurrency:
  group: aws-llm-d-eks-lab
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  CLUSTER: llm-d-eks-lab
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VERSION: "1.13.4"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      cluster_wanted: ${{ steps.scope.outputs.cluster_wanted }}
      tier: ${{ steps.scope.outputs.tier }}
      infra: ${{ steps.scope.outputs.infra }}
      gitops: ${{ steps.scope.outputs.gitops }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read deploy/config.yaml and work out what changed
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          cluster=$(awk '/^cluster:/{print $2}' deploy/config.yaml)
          tier=$(awk '/^tier:/{print $2}' deploy/config.yaml)
          case "$cluster" in true|false) ;; *) echo "::error::deploy/config.yaml cluster must be true|false, got '$cluster'"; exit 1 ;; esac
          case "$tier" in none|sim|small|gpu|kimi) ;; *) echo "::error::deploy/config.yaml tier must be none|sim|small|gpu|kimi, got '$tier'"; exit 1 ;; esac

          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Manual run, new branch, or force-push: check both. An unchanged
            # Terraform layer produces an empty plan and is not applied.
            infra=true; gitops=true
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            infra=false; gitops=false
            # deploy/config.yaml counts as infra too: flipping cluster: true must
            # create the cluster. On an existing cluster the plan is empty.
            echo "$changed" | grep -qE '^(terraform/10-cluster/|deploy/config\.yaml$|\.github/workflows/deploy\.yml$)' && infra=true
            echo "$changed" | grep -qE '^(gitops/|deploy/|scripts/wait-for-apps\.sh$)' && gitops=true
            # A Terraform apply can change what Argo CD renders (root values).
            [ "$infra" = true ] && gitops=true
          fi

          if [ "$cluster" = false ]; then
            echo "::notice::deploy/config.yaml has cluster: false — CI creates nothing. Use the destroy workflow to remove an existing cluster."
          fi
          echo "cluster_wanted=$cluster tier=$tier infra=$infra gitops=$gitops"
          {
            echo "cluster_wanted=$cluster"
            echo "tier=$tier"
            echo "infra=$infra"
            echo "gitops=$gitops"
          } >> "$GITHUB_OUTPUT"

  cluster:
    needs: scope
    if: needs.scope.outputs.cluster_wanted == 'true' && needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: terraform/10-cluster
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      # Actions logs are public on a public repo.
      - name: Mask account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Only export inputs that are set: an empty TF_VAR_ is "", not null.
      - name: Terraform inputs
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          REAPER_ROLE_ARN: ${{ vars.REAPER_ROLE_ARN }}
          ADMIN_PRINCIPAL_ARN: ${{ vars.ADMIN_PRINCIPAL_ARN }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          ALLOWED_CIDRS: ${{ secrets.ALLOWED_CIDRS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${{ vars.STATE_BUCKET }}" ] || { echo "::error::Repo variable STATE_BUCKET is not set"; exit 1; }
          [ -n "$ALLOWED_CIDRS" ] || { echo "::error::Secret ALLOWED_CIDRS is not set — the public endpoints would be refused"; exit 1; }
          {
            echo "TF_VAR_region=$AWS_REGION"
            echo "TF_VAR_project=$CLUSTER"
            echo "TF_VAR_deploy_role_arn=$DEPLOY_ROLE_ARN"
            echo "TF_VAR_allowed_cidrs=$ALLOWED_CIDRS"
            [ -n "$REAPER_ROLE_ARN" ] && echo "TF_VAR_reaper_role_arn=$REAPER_ROLE_ARN"
            [ -n "$ADMIN_PRINCIPAL_ARN" ] && echo "TF_VAR_admin_principal_arn=$ADMIN_PRINCIPAL_ARN"
            [ -n "$BUDGET_ALERT_EMAIL" ] && echo "TF_VAR_budget_alert_email=$BUDGET_ALERT_EMAIL"
            [ -n "$HF_TOKEN" ] && echo "TF_VAR_hf_token=$HF_TOKEN"
            true
          } >> "$GITHUB_ENV"

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      # A cluster built before this role existed has no access entry for it,
      # and the Helm/Kubernetes providers cannot refresh without one. Create it
      # out of band, then adopt it into state. A no-op after the first run.
      - name: Ensure this role can reach an existing cluster
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          admin_policy="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          if ! aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "No cluster yet — Terraform will create it with this role's access entry."
            exit 0
          fi
          if ! aws eks describe-access-entry --cluster-name "$CLUSTER" --principal-arn "$DEPLOY_ROLE_ARN" >/dev/null 2>&1; then
            aws eks create-access-entry --cluster-name "$CLUSTER" --principal-arn "$DEPLOY_ROLE_ARN" --type STANDARD >/dev/null
            aws eks associate-access-policy --cluster-name "$CLUSTER" --principal-arn "$DEPLOY_ROLE_ARN" \
              --policy-arn "$admin_policy" --access-scope type=cluster >/dev/null
            sleep 20
          fi
          terraform state show 'module.eks.aws_eks_access_entry.this["deploy"]' >/dev/null 2>&1 || \
            terraform import 'module.eks.aws_eks_access_entry.this["deploy"]' "${CLUSTER}:${DEPLOY_ROLE_ARN}"
          terraform state show 'module.eks.aws_eks_access_policy_association.this["deploy_admin"]' >/dev/null 2>&1 || \
            terraform import 'module.eks.aws_eks_access_policy_association.this["deploy_admin"]' "${CLUSTER}#${DEPLOY_ROLE_ARN}#${admin_policy}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case $code in
            0) echo "changes=false" >> "$GITHUB_OUTPUT"; echo "### 10-cluster: no changes" >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT"
               { echo "### 10-cluster plan"; echo '```'; terraform show -no-color tfplan | grep -E '^\s*# |^Plan:' ; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit $code ;;
          esac

      - name: terraform apply
        if: steps.plan.outputs.changes == 'true'
        run: terraform apply -no-color tfplan

  verify:
    needs: [scope, cluster]
    # After a successful (or skipped) cluster job, whenever something Argo CD
    # renders may have changed.
    if: >-
      always() &&
      needs.scope.outputs.cluster_wanted == 'true' &&
      needs.scope.outputs.gitops == 'true' &&
      (needs.cluster.result == 'success' || needs.cluster.result == 'skipped')
    runs-on: ubuntu-latest
    # Kimi pulls 145 GB of weights; a cold start is ~15 minutes.
    timeout-minutes: 75
    env:
      TIER: ${{ needs.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Mask account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: Cluster present?
        id: cluster
        run: |
          if aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER" >/dev/null
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cluster: true but no cluster exists — push a change under terraform/10-cluster/ or run this workflow manually to create it."
          fi

      - name: Wait for Argo CD to converge on git
        if: steps.cluster.outputs.exists == 'true'
        run: ./scripts/wait-for-apps.sh 3600

      # Through a port-forward rather than the public NLB: ALLOWED_CIDRS
      # normally excludes GitHub's runners.
      - name: Smoke test
        if: steps.cluster.outputs.exists == 'true' && env.TIER != 'none'
        run: |
          set -euo pipefail
          model=$(awk '/^model:/{print $2}' "gitops/tiers/${TIER}.yaml")
          kubectl -n llm-d port-forward svc/llm-d-epp 8080:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/v1/models && break; sleep 2; done
          resp=$(curl -sS --max-time 300 http://localhost:8080/v1/completions \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$model\",\"prompt\":\"def fibonacci(n):\",\"max_tokens\":48}")
          echo "$resp" | jq . || echo "$resp"
          text=$(echo "$resp" | jq -r '.choices[0].text // empty')
          [ -n "$text" ] || { echo "::error::No completion returned by $model"; exit 1; }
          api=$(kubectl -n llm-d get svc llm-d-public -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          ui=$(kubectl -n llm-d get svc open-webui-public -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          {
            echo "### Serving \`$model\` (tier: $TIER)"
            echo "- Model API: \`http://${api:-<pending>}\`"
            echo "- Open WebUI: http://${ui:-<pending>}"
            echo '```'; echo "$text"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the inference layer is gone (tier none)
        if: steps.cluster.outputs.exists == 'true' && env.TIER == 'none'
        run: |
          left=$(kubectl get nodepools.karpenter.sh --no-headers 2>/dev/null | grep -c . || true)
          echo "NodePools remaining: $left"
          [ "$left" -eq 0 ] || { echo "::error::tier none but $left NodePool(s) remain"; exit 1; }
          echo "### tier: none — inference layer pruned, cluster idle" >> "$GITHUB_STEP_SUMMARY"
